project_id = "cjcjfdwdlsdgyvshuncn"

# Logflare analytics needs the Docker daemon exposed over TCP on Windows, which
# Docker Desktop does not do by default. Not needed for local development.
[analytics]
enabled = false

[auth]
# LOCAL STACK ONLY. The hosted project's Site URL and redirect allowlist are set
# in the Supabase dashboard (Auth -> URL Configuration). Do NOT run
# `supabase config push` with this block in place: it would copy these
# localhost values to production and break every production auth redirect.
#
# The CLI's defaults here are site_url http://127.0.0.1:3000 with an allowlist
# of only https://127.0.0.1:3000 (read from the running auth container).
#
# Tested against the local stack on 2026-09-13: Supabase Auth keeps a
# redirect_to whose hostname matches site_url (any port or path) or that is on
# the allowlist, and silently replaces anything else with site_url. A reset
# requested for http://example.test:5173/reset-password produced an email whose
# link landed on http://localhost:5173/ - the home page, holding a recovery
# session but showing no reset form.
#
# Under the defaults, site_url's host is 127.0.0.1 while the dev server runs at
# http://localhost:5173 (.claude/launch.json): a different hostname, not on the
# allowlist. So the redirects this app requests locally - /reset-password from
# resetPasswordForEmail(), /app from signUp(), the /invite flow - fall into that
# same case and would be sent to 127.0.0.1:3000, where nothing listens.
# 127.0.0.1:5173 is allowlisted explicitly because, by that same rule, it is a
# different hostname from site_url's localhost.
site_url = "http://localhost:5173"
additional_redirect_urls = [
  "http://localhost:5173/**",
  "http://127.0.0.1:5173/**",
]

# Authenticator-app (TOTP) two-factor login. Hosted Supabase projects have TOTP
# enabled by default; this makes the local stack match. Enforcement lives in the
# database — see 20260921090000_mfa_enforcement.sql.
[auth.mfa]
max_enrolled_factors = 10

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[auth.email]
# Skip the Mailpit confirmation round-trip when signing up locally.
enable_confirmations = false

# Neither function below is ever called by a LexDiary user — the digest is
# invoked only by pg_cron/pg_net (a shared secret it checks itself, see
# whatsapp-diary-digest/index.ts), and the webhook only by the WhatsApp
# provider. Every other function in this project keeps the default (require
# a real user JWT).
[functions.whatsapp-diary-digest]
verify_jwt = false

[functions.notify-new-signup]
# Called only by the AFTER INSERT trigger on public.profiles (via pg_net), with
# the same shared secret as whatsapp-diary-digest.
verify_jwt = false

[functions.whatsapp-webhook]
verify_jwt = false
